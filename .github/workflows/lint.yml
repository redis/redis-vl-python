name: Lint

on:
  pull_request:
  push:
    branches:
      - main

env:
  UV_VERSION: "0.13.1"

jobs:
  lock:
    name: Check uv.lock is up to date
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    # Fails a pyproject.toml change that was never locked, before the drift
    # lands on main and dirties the next contributor's tree.
    - name: Check lockfile
      run: uv lock --check

  check:
    name: Style-check ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        python-version: ${{ matrix.python-version }}   # sets UV_PYTHON
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      env:
        MATRIX_PYTHON: ${{ matrix.python-version }}
      run: |
        set -euo pipefail

        # torch has no cp315 wheels on PyPI yet, so sentence-transformers
        # (and `all`, which includes it) cannot install on 3.15.
        extras=(--all-extras)
        if [ "$MATRIX_PYTHON" = "3.15" ]; then
          extras+=(--no-extra sentence-transformers --no-extra all)
        fi
        uv sync "${extras[@]}" --frozen

    - name: check-sort-import
      run: |
        make check-sort-imports

    - name: check-black-format
      run: |
        make check-format

    - name: check-mypy
      run: |
        make check-types
