name: Test Suite

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *" # 2 AM UTC nightly

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.1"

jobs:
  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    # Needs API-key secrets. Fork PRs and Dependabot-triggered runs get none, so
    # they skip here; a maintainer runs them via test-fork-pr.yml instead.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run service tests
        uses: ./.github/actions/run-service-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          pytest-args: --cov --cov-report=
        env:
          HF_HOME: ${{ github.workspace }}/hf_cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # The live Azure OpenAI tests gate themselves on AZURE_OPENAI_ENDPOINT,
          # AZURE_OPENAI_API_KEY and OPENAI_API_VERSION: if any of the three is empty
          # or unset they skip, so an absent secret disables them and re-adding it
          # re-enables them with no code change. These lines stay wired up for that
          # reason. (test_non_supported_dtypes is deliberately left ungated -- it
          # validates dtype before any client is built and needs no network.)
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LANGCACHE_WITH_ATTRIBUTES_API_KEY: ${{ secrets.LANGCACHE_WITH_ATTRIBUTES_API_KEY }}
          LANGCACHE_WITH_ATTRIBUTES_CACHE_ID: ${{ secrets.LANGCACHE_WITH_ATTRIBUTES_CACHE_ID }}
          LANGCACHE_WITH_ATTRIBUTES_URL: ${{ secrets.LANGCACHE_WITH_ATTRIBUTES_URL }}
          LANGCACHE_NO_ATTRIBUTES_API_KEY: ${{ secrets.LANGCACHE_NO_ATTRIBUTES_API_KEY }}
          LANGCACHE_NO_ATTRIBUTES_CACHE_ID: ${{ secrets.LANGCACHE_NO_ATTRIBUTES_CACHE_ID }}
          LANGCACHE_NO_ATTRIBUTES_URL: ${{ secrets.LANGCACHE_NO_ATTRIBUTES_URL }}
          COVERAGE_FILE: .coverage.service

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-service
          path: .coverage.service
          include-hidden-files: true   # the data file is a dotfile
          retention-days: 7

  test:
    name: Python ${{ matrix.python-version }} - redis-py ${{ matrix.redis-py-version }} [${{ matrix.redis-image }}]
    runs-on: ubuntu-latest
    # `needs` is here to order this job after the HF model cache is primed, not
    # to gate it on the service suite passing (it was `needs: prime-cache` when
    # it was introduced in #306). Without a status check function, `needs` also
    # implies `success()`, which meant a third-party API outage skipped all 45
    # matrix legs and left PRs with zero Redis coverage behind a single red
    # check. `!cancelled()` keeps the ordering and drops the cascade: a cold
    # cache just costs these legs a model download.
    needs: service-tests
    if: ${{ !cancelled() }}
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      HF_HOME: ${{ github.workspace }}/hf_cache
      REDIS_IMAGE: ${{ matrix.redis-image }}
      REDIS_PY_VERSION: ${{ matrix.redis-py-version }}
      # Required: without it `uv run` re-syncs the venv to uv.lock and reverts
      # the redis-py pin set below.
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        redis-py-version: ["6.x", "7.x", "8.x"]
        # `redis:latest` floats, so a failure on it is not reproducible from a
        # SHA; it is advisory below. Pinned tags carry the blocking coverage.
        redis-image: ["redis:8.2", "redis:8.4", "redis:latest"]
        include:
          - redis-image: "redis:latest"
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: ${{ runner.os }}-hf-cache

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          set -euo pipefail

          uv sync --all-extras --frozen

          # Must cover every redis-py-version matrix value; unhandled values fail.
          case "$REDIS_PY_VERSION" in
            "6.x") spec="redis>=6,<7" ;;
            "7.x") spec="redis>=7,<8" ;;
            "8.x") spec="redis>=8.1,<9" ;;
            *)
              echo "::error title=Unhandled redis-py-version::Matrix value '${REDIS_PY_VERSION}' has no install rule -- add a case branch in .github/workflows/test.yml."
              exit 1
              ;;
          esac

          uv pip install "$spec"
          uv run python -c 'import redis; print("redis-py:", redis.__version__)'

      - name: Run tests
        run: |
          # One data file per leg; the coverage job combines them. Artifact
          # names cannot contain ':', so `redis:8.4` becomes `redis-8.4`.
          leg="core-py${{ matrix.python-version }}-redis-py-${REDIS_PY_VERSION}-${REDIS_IMAGE//:/-}"
          echo "COVERAGE_LEG=$leg" >> "$GITHUB_ENV"
          COVERAGE_FILE=".coverage.$leg" make test ARGS="--cov --cov-report="

      - name: Upload coverage data
        if: ${{ !cancelled() && env.COVERAGE_LEG != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ env.COVERAGE_LEG }}
          path: .coverage.${{ env.COVERAGE_LEG }}
          include-hidden-files: true   # the data file is a dotfile
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Runs whenever the test jobs finish, pass or fail: coverage from a red run
    # is still a measurement, and a skipped service run (fork PRs) just leaves
    # that segment out. Codecov carries the missing segment forward.
    needs: [test, service-tests]
    if: ${{ !cancelled() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install coverage
        # The dev group pins coverage through pytest-cov, so this reads the
        # data with the same coverage version that wrote it.
        run: |
          uv sync --frozen --only-group dev --no-install-project

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage
        id: combine
        run: |
          set -euo pipefail
          shopt -s nullglob
          cov() { uv run --no-sync coverage "$@"; }

          {
            echo "## Coverage"
            echo
            echo "| Segment | Data files | Total |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Segment data lives in its own directory: `patch = ["subprocess"]`
          # turns on parallel mode, so reporting on ./.coverage would otherwise
          # absorb any ./.coverage.* file beside it.
          mkdir -p coverage-segments
          segments=()
          for seg in core service; do
            files=(coverage-data/.coverage."$seg"*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "| $seg | 0 | not run |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            data="coverage-segments/$seg"
            cov combine --keep --data-file="$data" "${files[@]}"
            cov xml --data-file="$data" -o "coverage-$seg.xml"
            echo "| $seg | ${#files[@]} | $(cov report --data-file="$data" --format=total)% |" >> "$GITHUB_STEP_SUMMARY"
            echo "$seg=true" >> "$GITHUB_OUTPUT"
            segments+=("$data")
          done

          if [ ${#segments[@]} -eq 0 ]; then
            echo "::warning title=No coverage data::No test job uploaded coverage data in this run."
            exit 0
          fi

          cov combine --keep --data-file=.coverage "${segments[@]}"
          cov html -d htmlcov
          {
            echo
            echo "All segments combined: **$(cov report --format=total)%**"
            echo
            echo "<details><summary>Per-file report</summary>"
            echo
            cov report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14

      # One upload per segment, each under its own flag. Codecov outages and
      # tokenless refusals (Dependabot PRs) must never fail CI, hence
      # fail_ci_if_error: false.
      - name: Upload core coverage to Codecov
        if: ${{ steps.combine.outputs.core == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-core.xml
          flags: core
          disable_search: true
          fail_ci_if_error: false

      - name: Upload service coverage to Codecov
        if: ${{ steps.combine.outputs.service == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-service.xml
          flags: service
          disable_search: true
          fail_ci_if_error: false

  notebooks:
    name: Notebook Validation
    runs-on: ubuntu-latest
    # Ordered after the HF cache is primed, not gated on it; see the `test` job.
    needs: service-tests
    # Needs API-key secrets, unavailable to fork PRs and Dependabot. Keep in
    # sync with service-tests.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    env:
      HF_HOME: ${{ github.workspace }}/hf_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: ${{ runner.os }}-hf-cache

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync --all-extras --frozen

      - name: Start Redis
        run: |
          set -euo pipefail
          # Wait for readiness: `make test-notebooks` probes Redis for SVS
          # support and silently skips 09_svs_vamana.ipynb if it can't connect.
          # Probe over the same host-to-published-port path the notebooks use.
          docker run -d --name redis -p 6379:6379 redis:8.4
          probe() {
            uv run --no-sync python -c "import redis; redis.Redis.from_url('redis://localhost:6379').ping()"
          }
          ready=0
          for _ in $(seq 1 30); do
            if probe 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            # Unsuppressed retry: distinguishes an unreachable server from a
            # broken venv or import.
            echo "Final probe attempt, stderr shown:"
            probe || true
            echo "::error title=Redis not ready::redis:8.4 never accepted a connection on localhost:6379 after 30 attempts"
            docker logs redis || true
            exit 1
          fi
          docker exec redis redis-cli INFO server | grep redis_version

      - name: Run notebooks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # The Azure cells in docs/user_guide/04_vectorizers.ipynb carry an
          # unconditional `# NBVAL_SKIP`, so notebook validation skips them whether or
          # not these secrets are set, and never blocks on getpass for missing
          # credentials. Restoring the secrets is therefore not enough on its own --
          # those markers have to be removed too. These lines stay wired up so that
          # re-enabling needs no workflow change.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          make test-notebooks

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
  
      - name: Install dependencies
        run: |
          uv sync --group docs --frozen

      - name: Build docs
        run: |
          make docs-build
