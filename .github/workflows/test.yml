name: Test Suite

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *" # 2 AM UTC nightly

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.3"

jobs:
  lock:
    name: Check uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # Fails a pyproject.toml change that was never locked, before the drift
      # lands on main and dirties the next contributor's tree.
      - name: Check lockfile
        run: uv lock --check

  # `service-tests` and `test` gate on this single 3.11 leg, not on the full
  # matrix below. Style and typing failures are almost always version-independent,
  # so one leg catches them, while a wobble on one interpreter no longer
  # suppresses every test result on the PR.
  #
  # The display name is spelled out because `jobs.<id>.name` cannot read the
  # `env` context; keep it in step with PYTHON_VERSION above.
  lint:
    name: Style-check 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run style checks
        uses: ./.github/actions/lint
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

  # The remaining interpreters. Nothing depends on this job, so a version-specific
  # mypy or install failure reports on its own without gating the test matrix.
  lint-matrix:
    name: Style-check ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run style checks
        uses: ./.github/actions/lint
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

  service-tests:
    needs: lint
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    uses: ./.github/workflows/service-tests.yml
    with:
      environment: ci-internal

  test:
    name: Python ${{ matrix.python-version }} - redis-py ${{ matrix.redis-py-version }} [${{ matrix.redis-image }}]
    runs-on: ubuntu-latest
    # Gated on the 3.11 lint leg only. service-tests no longer primes a shared
    # HuggingFace cache, so there is no ordering reason to wait for it, and a
    # third-party outage there cannot skip these legs.
    needs: lint
    env:
      HF_HOME: ${{ github.workspace }}/hf_cache
      REDIS_IMAGE: ${{ matrix.redis-image }}
      REDIS_PY_VERSION: ${{ matrix.redis-py-version }}
      # Required: without it `uv run` re-syncs the venv to uv.lock and reverts
      # the redis-py pin set below.
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        redis-py-version: ["6.x", "7.x", "8.x"]
        redis-image: ["redis:8.2", "redis:8.4", "redis:latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: ${{ runner.os }}-hf-cache

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          set -euo pipefail

          uv sync --all-extras --frozen

          # Must cover every redis-py-version matrix value; unhandled values fail.
          case "$REDIS_PY_VERSION" in
            "6.x") spec="redis>=6,<7" ;;
            "7.x") spec="redis>=7,<8" ;;
            "8.x") spec="redis>=8.1,<9" ;;
            *)
              echo "::error title=Unhandled redis-py-version::Matrix value '${REDIS_PY_VERSION}' has no install rule -- add a case branch in .github/workflows/test.yml."
              exit 1
              ;;
          esac

          uv pip install "$spec"
          uv run python -c 'import redis; print("redis-py:", redis.__version__)'

      - name: Run tests
        run: |
          make test

  notebooks:
    name: Notebook Validation
    runs-on: ubuntu-latest
    # Runs after service-tests without depending on its result: `!cancelled()`
    # stops a failing service suite from skipping this job. It needs API-key
    # secrets, which fork and Dependabot PRs cannot reach, so keep the guard in
    # sync with service-tests.
    needs: service-tests
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    environment:
      name: ci-internal
      deployment: false
    env:
      HF_HOME: ${{ github.workspace }}/hf_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # Jobs that hold credentials do not use the Actions cache.
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}   # sets UV_PYTHON

      - name: Install dependencies
        run: |
          uv sync --all-extras --frozen

      - name: Start Redis
        run: |
          set -euo pipefail
          # Wait for readiness: `make test-notebooks` probes Redis for SVS
          # support and silently skips 09_svs_vamana.ipynb if it can't connect.
          # Probe over the same host-to-published-port path the notebooks use.
          docker run -d --name redis -p 6379:6379 redis:8.4
          probe() {
            uv run --no-sync python -c "import redis; redis.Redis.from_url('redis://localhost:6379').ping()"
          }
          ready=0
          for _ in $(seq 1 30); do
            if probe 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            # Unsuppressed retry: distinguishes an unreachable server from a
            # broken venv or import.
            echo "Final probe attempt, stderr shown:"
            probe || true
            echo "::error title=Redis not ready::redis:8.4 never accepted a connection on localhost:6379 after 30 attempts"
            docker logs redis || true
            exit 1
          fi
          docker exec redis redis-cli INFO server | grep redis_version

      - name: Run notebooks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # The Azure cells in docs/user_guide/04_vectorizers.ipynb carry an
          # unconditional `# NBVAL_SKIP`, so notebook validation skips them whether or
          # not these secrets are set, and never blocks on getpass for missing
          # credentials. Restoring the secrets is therefore not enough on its own --
          # those markers have to be removed too. These lines stay wired up so that
          # re-enabling needs no workflow change.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          make test-notebooks

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync --group docs --frozen

      - name: Build docs
        run: |
          make docs-build
