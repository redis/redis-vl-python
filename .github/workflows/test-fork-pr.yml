name: Test External PR
run-name: "External PR #${{ inputs.pr_number }} @ ${{ inputs.expected_head_sha }} (dispatched by ${{ github.actor }})"

# Maintainer-dispatched credentialed test run for PRs that cannot get one
# automatically: fork PRs (no access to secrets) and same-repo Dependabot PRs
# (Dependabot secrets rather than Actions secrets, so `secrets.*` resolve empty).
#
# `expected_head_sha` is mandatory and pinned through to the checkout. It closes
# the window where a contributor pushes new commits between the maintainer
# reviewing the diff and the secrets being exposed to it.
#
# The credentials live in the `ci-external` environment, which requires a
# reviewer-team approval before service-tests starts. Because the run can only
# ever check out the dispatched SHA, approving it approves exactly that commit;
# a new push needs a new dispatch and a new approval. The procedure is in
# CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test'
        required: true
        type: number
      expected_head_sha:
        description: 'Expected PR head SHA to run'
        required: true
        type: string

concurrency:
  group: external-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.3"

jobs:
  setup:
    name: Validate PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      head_repo: ${{ steps.pr-info.outputs.head_repo }}
      base_sha: ${{ steps.pr-info.outputs.base_sha }}
      check_id: ${{ steps.check.outputs.check_id }}
    steps:
      # ci-external only releases credentials to runs on main, so a dispatch from
      # another branch would otherwise get as far as a misleading failed check on
      # the PR. Fail here instead, before the check run exists.
      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Dispatch from main::Run this workflow from main, not ${GITHUB_REF}."
            exit 1
          fi

      # Split from the provenance checks below so that the check run exists
      # before they run: a rejection then reports on the pull request itself
      # rather than only in this workflow's log.
      - name: Resolve PR head
        id: pr-info
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const expectedHeadSha = (process.env.EXPECTED_HEAD_SHA || '').trim();
            if (!/^[0-9a-f]{40}$/i.test(expectedHeadSha)) {
              core.setFailed(`Expected head SHA must be a 40-character commit SHA. Received: ${expectedHeadSha}`);
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed(`PR number must be a positive integer. Received: ${process.env.PR_NUMBER}`);
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.data.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open`);
              return;
            }

            // Null when the contributor deleted their fork with the PR still
            // open. Dereferencing it would surface a raw TypeError instead.
            if (!pr.data.head.repo) {
              core.setFailed(
                `PR #${prNumber} has no head repository -- the fork was probably deleted.`
              );
              return;
            }

            if (pr.data.head.sha !== expectedHeadSha) {
              core.setFailed(
                `PR #${prNumber} head SHA changed. Expected ${expectedHeadSha}, found ${pr.data.head.sha}.`
              );
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('head_repo', pr.data.head.repo.full_name);
            core.setOutput('base_sha', pr.data.base.sha);

            console.log(`Testing PR #${prNumber}`);
            console.log(`  Head SHA: ${pr.data.head.sha}`);
            console.log(`  Head Repo: ${pr.data.head.repo.full_name}`);

      - name: Create check run
        id: check
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = process.env.PR_NUMBER;
            const headSha = process.env.HEAD_SHA;
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'External PR - Service Tests',
              head_sha: headSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: 'External PR Service Tests Running',
                summary: `Service tests are in progress for PR #${prNumber} at commit ${headSha}.`,
                text: `[View Active Run](${runUrl})\n\nPR: #${prNumber}\nHead SHA: ${headSha}`,
              },
            });
            core.setOutput('check_id', String(check.data.id));

      - name: Check PR is eligible
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const isForkPr = pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            const isDependabotPr = pr.data.user.login === 'dependabot[bot]';

            if (!isForkPr && !isDependabotPr) {
              core.setFailed(
                `PR #${prNumber} is neither from a fork nor authored by dependabot[bot]. Use the regular workflow.`
              );
              return;
            }

            if (isDependabotPr) {
              if (isForkPr || !pr.data.head.ref.startsWith('dependabot/')) {
                core.setFailed(
                  `PR #${prNumber} is not a standard same-repo Dependabot branch.`
                );
                return;
              }

              const allowedDependabotFiles = [
                /^pyproject\.toml$/,
                /^uv\.lock$/,
                /^requirements(?:\/.*|[^/]*)\.txt$/,
                /^setup\.cfg$/,
              ];
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const disallowedFiles = changedFiles
                .map((file) => file.filename)
                .filter(
                  (filename) => !allowedDependabotFiles.some((pattern) => pattern.test(filename))
                );

              if (disallowedFiles.length > 0) {
                core.setFailed(
                  `PR #${prNumber} contains non-dependency file changes for a Dependabot run: ${disallowedFiles.slice(0, 10).join(', ')}`
                );
                return;
              }
            }

      # Shown on the run page the approver opens from the ci-external prompt.
      # The title and author are PR-controlled, so they are read from the API
      # here and escaped, never interpolated into this script.
      - name: Publish review summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const baseSha = process.env.BASE_SHA;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            const escape = (text) =>
              String(text).replace(/[&<>"'`|\\\[\]]/g, (c) => `&#${c.charCodeAt(0)};`).replace(/\s+/g, ' ');
            const server = process.env.GITHUB_SERVER_URL;

            await core.summary
              .addHeading(`External PR #${prNumber}`, 2)
              .addTable([
                ['Pull request', `<a href="${server}/${owner}/${repo}/pull/${prNumber}">#${prNumber}</a> ${escape(pr.title)}`],
                ['Author', escape(pr.user.login)],
                ['Head repository', escape(pr.head.repo.full_name)],
                ['Commit to approve', `<code>${headSha}</code>`],
                ['Changes', `<a href="${server}/${owner}/${repo}/compare/${baseSha}...${headSha}">Compare ${baseSha.slice(0, 7)}...${headSha.slice(0, 7)}</a>`],
              ])
              .addRaw(
                'Approving ci-external releases the test credentials to this commit only. ' +
                'Before approving, check the compare view for changes to conftest.py, Makefile, ' +
                'pyproject.toml and uv.lock, which run with the credentials in scope.',
                true
              )
              .write();

  service-tests:
    needs: setup
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/service-tests.yml
    with:
      environment: ci-external
      repository: ${{ needs.setup.outputs.head_repo }}
      ref: ${{ needs.setup.outputs.head_sha }}

  report:
    name: Report result
    runs-on: ubuntu-latest
    needs: [setup, service-tests]
    # Runs on validation failure too, which is the case the check run exists for.
    # Guarded on check_id: if `Resolve PR head` failed there is no check to update,
    # and an empty id would render invalid JavaScript below.
    if: ${{ always() && needs.setup.outputs.check_id != '' }}
    permissions:
      checks: write
    steps:
      - name: Finalize check run
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ needs.setup.outputs.check_id }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          SETUP_RESULT: ${{ needs.setup.result }}
          TESTS_RESULT: ${{ needs.service-tests.result }}
        with:
          script: |
            const setupResult = process.env.SETUP_RESULT;
            const testsResult = process.env.TESTS_RESULT;
            const prNumber = process.env.PR_NUMBER;
            const headSha = process.env.HEAD_SHA;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let conclusion;
            let title;
            let summary;

            if (setupResult !== 'success') {
              conclusion = setupResult === 'cancelled' ? 'cancelled' : 'failure';
              title = 'External PR Validation Failed';
              summary = `PR #${prNumber} did not pass dispatch validation, so no tests were run. Click "Details" for the reason.`;
            } else if (testsResult === 'success') {
              conclusion = 'success';
              title = 'External PR Service Tests Passed';
              summary = `All service tests passed for PR #${prNumber}.`;
            } else if (testsResult === 'cancelled' || testsResult === 'skipped') {
              conclusion = 'cancelled';
              title = 'External PR Service Tests Cancelled';
              summary = `The external PR service tests were cancelled for PR #${prNumber}.`;
            } else {
              conclusion = 'failure';
              title = 'External PR Service Tests Failed';
              summary = `The service tests failed for PR #${prNumber}. Click "Details" to view the full test output and logs.`;
            }

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title,
                summary,
                text: `[View Active Run](${runUrl})\n\nPR: #${prNumber}\nHead SHA: ${headSha}`,
              },
            });
